name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh the pre-generated country grids every hour so the cloud map
    # on the static site stays reasonably current.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Persist aurora/grid.py's disk cache across workflow runs so a country
      # that succeeded on a previous run doesn't need to re-fetch, freeing
      # Open-Meteo quota for countries that still need refreshing.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: aurora-grid-cache-${{ github.run_id }}
          restore-keys: aurora-grid-cache-

      - name: Build static site
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python tools/build_static.py

      # Fail fast if build/ wasn't produced so we don't silently upload nothing.
      - name: Verify build output
        run: |
          test -d build || { echo "build/ missing after build step"; exit 1; }
          test -f build/index.html || { echo "build/index.html missing"; exit 1; }
          echo "build contains:" && ls build

      - uses: actions/configure-pages@v5

      # Floating v3 tag — v3.0.1 was pinned after GitHub sunset upload-artifact@v3
      # in 2025, but deploy-pages@v4 has since drifted and the old pin stopped
      # producing an artifact deploy-pages could find. The v3 tag tracks the
      # latest v3.x which keeps the two in sync.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - id: deploy
        uses: actions/deploy-pages@v4
