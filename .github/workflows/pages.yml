name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh the pre-generated country grids every hour so the cloud map
    # on the static site stays reasonably current.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Persist aurora/grid.py's disk cache across workflow runs so a country
      # that succeeded on a previous run doesn't need to re-fetch, freeing
      # Open-Meteo quota for countries that still need refreshing.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: aurora-grid-cache-${{ github.run_id }}
          restore-keys: aurora-grid-cache-

      - name: Build static site
        run: python tools/build_static.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - id: deploy
        uses: actions/deploy-pages@v4
